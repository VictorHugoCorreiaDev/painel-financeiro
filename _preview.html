<!doctype html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;background:#888;font-family:sans-serif}
  .rot{color:#fff;font:600 12px sans-serif;padding:6px 10px;background:#333}
  iframe{width:1280px;height:900px;border:0;display:block}
</style></head><body>
<div class="rot" id="r1">carregando...</div>
<iframe id="f" src="/index.html"></iframe>
<script>
// tela=painel|lancamentos|cartoes|config ; tema=claro|escuro  (via ?tela=&tema=)
var q = new URLSearchParams(location.search);
var TELA = q.get('tela') || 'painel';
var TEMA = q.get('tema') || 'claro';
setTimeout(function(){
  var f = document.getElementById('f'), d = f.contentDocument, w = f.contentWindow;
  try{
    d.documentElement.dataset.tema = TEMA;
    d.getElementById('appLoading').classList.add('hidden');
    d.getElementById('loginScreen').classList.add('hidden');
    d.getElementById('onboardingScreen').classList.add('hidden');
    // demo vive em julho/2026
    w.state.year = 2026; w.state.month = 6; w.state.view = TELA;
    w.renderNav(); w.renderBrand(); w.buildSidebarPeriod(); w.buildInvNav();
    w.renderPeriodUI(); w.renderView();
    document.getElementById('r1').textContent = TELA + ' / ' + TEMA;
  }catch(e){ document.getElementById('r1').textContent = 'ERRO: ' + e.message; }
}, 2600);
</script>
</body></html>
